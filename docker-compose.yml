services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bq
      POSTGRES_PASSWORD: bq
      POSTGRES_DB: bacterioquest
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  server:
    image: node:20-alpine
    working_dir: /app/server
    volumes: [".:/app"]
    environment:
      DATABASE_URL: postgres://bq:bq@db:5432/bacterioquest
      JWT_SECRET: dev-secret
      CLIENT_URL: http://localhost:5173
    command: sh -c "npm install && npm run migrate && npm run seed && npm run dev"
    ports: ["4000:4000"]
    depends_on: [db]

  client:
    image: node:20-alpine
    working_dir: /app/client
    volumes: [".:/app"]
    environment:
      VITE_PROXY_TARGET: http://server:4000
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on: [server]

volumes:
  pgdata:
